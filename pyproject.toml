[project]
name = "customer-retention-intelligence"
version = "1.0.0"
description = "Time-aware repeat-purchase inactivity analytics and retention decision support demo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3",
  "joblib>=1.4,<2",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pyarrow>=18,<30",
  "plotly>=5.24,<7",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.43,<2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
